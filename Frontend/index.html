<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Componentes PC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <span style="font-size:1.5rem;">🖥️</span>
    <h1>Tienda de <span>Componentes</span></h1>
    <span class="header-badge">API REST v1.0</span>
  </header>

  <div class="container">

    <!-- Formulario -->
    <div class="card">
      <p class="card-title" id="form-titulo">Agregar Producto</p>

      <form id="form-producto">
        <input type="hidden" id="producto-id">

        <div class="form-group span-2">
          <label for="nombre">Nombre del producto</label>
          <input type="text" id="nombre" placeholder="Ej: RTX 4070 Super" required>
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">-- Seleccionar --</option>
            <option value="CPU">CPU</option>
            <option value="GPU">GPU</option>
            <option value="RAM">RAM</option>
            <option value="Almacenamiento">Almacenamiento</option>
            <option value="Periférico">Periférico</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" placeholder="Ej: 250000" min="0" required>
        </div>

        <div class="form-group">
          <label for="stock">Stock</label>
          <input type="number" id="stock" placeholder="Ej: 10" min="0" value="0">
        </div>

        <div class="form-group span-4">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" placeholder="Descripción breve del producto..."></textarea>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display:none">
            ✕ Cancelar
          </button>
          <button type="submit" class="btn btn-primary" id="btn-submit">
            + Agregar producto
          </button>
        </div>
      </form>
    </div>

    <!-- Tabla -->
    <div class="card">
      <div class="tabla-header">
        <p class="card-title" style="margin-bottom:0">Productos disponibles</p>
        <div class="search-box">
          <span class="icon-search">🔍</span>
          <input type="text" id="buscador" placeholder="Buscar producto...">
        </div>
      </div>

      <div class="table-wrapper">
        <table id="tabla-productos">
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Categoría</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="cuerpo-tabla">
            <tr>
              <td colspan="6">
                <div class="empty-state">
                  <div class="icon">⚙️</div>
                  <p>Cargando productos...</p>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Toast de notificaciones -->
  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
