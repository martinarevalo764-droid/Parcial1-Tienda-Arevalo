<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Componentes PC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <span style="font-size:1.5rem;">🖥️</span>
    <h1>Tienda de <span>Componentes</span></h1>
    <span class="header-badge">API REST v1.0</span>
  </header>

  <div class="container">

    <!-- Formulario -->
    <div class="card">
      <p class="card-title" id="form-titulo">Agregar Producto</p>
      <form id="form-producto">
        <input type="hidden" id="producto-id">

        <div class="form-group span-2">
          <label for="nombre">Nombre del producto</label>
          <input type="text" id="nombre" placeholder="Ej: RTX 4070 Super" required>
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria" required>
            <option value="">-- Seleccionar --</option>
            <option value="CPU">CPU</option>
            <option value="GPU">GPU</option>
            <option value="RAM">RAM</option>
            <option value="Almacenamiento">Almacenamiento</option>
            <option value="Periférico">Periférico</option>
            <option value="Otro">Otro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" placeholder="Ej: 250000" min="0" required>
        </div>
        <div class="form-group">
          <label for="stock">Stock</label>
          <input type="number" id="stock" placeholder="Ej: 10" min="0" value="0">
        </div>
        
        <div class="form-group span-2">
          <label for="imagen">URL de la Imagen</label>
          <input type="url" id="imagen" placeholder="Ej: https://web.com/imagen.jpg">
        </div>
        <div class="form-group span-4">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" placeholder="Descripción breve del producto..."></textarea>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display:none">✕ Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-submit">+ Agregar producto</button>
        </div>
      </form>
    </div>

    <!-- Sección de productos con pestañas -->
    <div class="card">

      <!-- Barra superior -->
      <div class="productos-topbar">
        <p class="card-title" style="margin-bottom:0">Productos disponibles</p>

        <div class="topbar-controls">
          <select id="filtro-categoria" class="filtro-select">
            <option value="">Todas las categorías</option>
            <option value="CPU">CPU</option>
            <option value="GPU">GPU</option>
            <option value="RAM">RAM</option>
            <option value="Almacenamiento">Almacenamiento</option>
            <option value="Periférico">Periférico</option>
            <option value="Otro">Otro</option>
          </select>

          <div class="search-box">
            <span class="icon-search">🔍</span>
            <input type="text" id="buscador" placeholder="Buscar producto...">
          </div>

          <div class="tab-toggle">
            <button class="tab-btn active" id="tab-lista"   onclick="cambiarVista('lista')"  title="Vista lista">☰ Lista</button>
            <button class="tab-btn"        id="tab-tienda"  onclick="cambiarVista('tienda')" title="Vista tienda">⊞ Tienda</button>
          </div>
        </div>
      </div>

      <!-- Vista Lista -->
      <div id="vista-lista">
        <div class="table-wrapper">
          <table id="tabla-productos">
            <thead>
              <tr>
                <th>#</th><th>Nombre</th><th>Categoría</th>
                <th>Precio</th><th>Stock</th><th>Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla">
              <tr><td colspan="6"><div class="empty-state"><div class="icon">⚙️</div><p>Cargando...</p></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Vista Tienda -->
      <div id="vista-tienda" style="display:none">
        <div id="grid-productos" class="productos-grid"></div>
      </div>

    </div>
  </div>

  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
